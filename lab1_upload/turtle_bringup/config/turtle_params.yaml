# Parameters for the servers. The speed limits are passed from the launch file
# (launch arguments max_linear_speed / max_angular_speed).
go_to_pose_server:
  ros__parameters:
    position_tolerance: 0.05   # turtlesim units
    yaw_tolerance: 0.03        # rad

draw_square_server:
  ros__parameters:
    default_side_length: 3.0   # used when the goal side_length is 0
    start_x: 5.544445
    start_y: 5.544445
